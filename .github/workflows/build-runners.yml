# Runner images use fixed version tags and pinned digests, so publishing is an explicit reviewed action.
name: Build runner images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish multi-platform runner images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMS: linux/amd64,linux/arm64
          BUILDER_NAME: promptlab-runners
          DIGEST_FILE: runner-digests.txt
        run: bash scripts/build-runners.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-image-digests-${{ github.sha }}
          path: runner-digests.txt
          if-no-files-found: error
          retention-days: 14

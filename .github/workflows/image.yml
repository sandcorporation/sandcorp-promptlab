# 배포 이미지(#8): main push마다 linux/arm64 이미지 셋을 GitHub 호스팅 arm64 실행기에서 네이티브로 굽고 ghcr에 올린다.
# main push에서는 release.yml이 검사 통과 뒤 workflow_call로 부른다. 이미지가 모두 오르면 release.yml이 production을 승격하고,
# Jenkins `sandcorp-promptlab`은 production 머리의 이 태그를 받아(jenkins-shared sandcorpDeploy deployFrom) oracle에 배포한다.
#
# 보안 규칙(공개 저장소):
#   - main push의 release.yml(workflow_call)과 수동 실행만. pull_request·pull_request_target으로 이미지를 굽거나 올리지 않는다.
#   - packages: write는 이 워크플로에만. 로그인은 GITHUB_TOKEN 하나, 다른 secrets 없음. build-args 없음(로그·이미지는 공개다).
#   - self-hosted·QEMU 없음. 액션은 공식(actions/*·docker/*)만, SHA 고정.
#   - 숨은 문항 데이터(비공개 문제은행)는 이 저장소에 없고 .dockerignore도 crates/store/problems·problems-data를 뺀다.
#     운영 문항은 Jenkins 배포 단계(extraCheckouts)에서만 받아 compose가 ro로 붙인다 — 이미지에 들어가지 않는다.
#
# 이미지마다 잡 하나(strategy.matrix.include, fail-fast: false). 같은 목록이 Jenkinsfile의 images에 있다 — 함께 고친다.
# 이미지 이름·태그·라벨은 옛 Jenkins 빌드(jenkins-shared build-image.sh)와 같다:
#   ghcr.io/sandcorporation/<name>:<커밋 sha 40자>, linux/arm64 하나, provenance 없음, 라벨 source·revision.
# 빌드 캐시는 이미지마다 같은 패키지의 :buildcache 태그(레지스트리 캐시, mode=max). Dockerfile의 cargo 캐시 마운트는
# 실행기마다 비어 있어 바뀐 소스는 처음부터 컴파일한다(층 캐시는 apt·wasm-bindgen 설치 같은 앞 단계만 맞는다).
name: image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 서버·워커(바이너리 둘) + 대시보드 wasm — compose.oracle.yaml PROMPTLAB_IMAGE
          - name: sandcorp-promptlab
            dockerfile: docker/server.Dockerfile
          # 판정기 + docker CLI — PROMPTLAB_JUDGE_IMAGE
          - name: sandcorp-promptlab-judge
            dockerfile: docker/judge.Dockerfile
          # 본문 검사 docker 소켓 프록시 — PROMPTLAB_PROXY_IMAGE
          - name: sandcorp-promptlab-docker-proxy
            dockerfile: docker/docker-proxy.Dockerfile
    env:
      IMAGE_REPO: ghcr.io/sandcorporation/${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드·push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}:buildcache,mode=max

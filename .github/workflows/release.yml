# main push → 검사 → 이미지 → production 승격(#8). production 브랜치 머리 = 운영 버전.
# Jenkins `sandcorp-promptlab`는 production push만 보고, 굽지도 검사하지도 않고 그 sha의 이미지를 받아 oracle에 배포한다
# (Jenkinsfile → jenkins-shared sandcorpDeploy deployFrom: 'production').
#
#   check   pr-check.yml(workflow_call) — PR과 같은 린트·타입·시험. 깨지면 이미지도 승격도 없다.
#   image   needs check. image.yml(workflow_call) — 이미지 셋마다 matrix 잡 하나, ghcr <이미지>:<sha>.
#   promote needs check·image. production을 이 sha로 fast-forward만(scripts/ci/promote.sh ff).
#           production이 이미 더 새 판이면(옛 실행이 늦게 끝남) 실패가 아니라 건너뜀.
# production은 앞으로만 간다(ruleset: 강제 push·삭제 금지). 되돌리기는 main에 revert PR — 이 흐름을 그대로 탄다.
# 급하면 Jenkins ROLLBACK_SHA(production은 그대로) — docs/deploy.md 「배포 흐름·되돌리기」
#
# 보안 규칙(공개 저장소):
#   - push: main만. pull_request·pull_request_target 없음. GitHub 호스팅 실행기만. 액션은 SHA 고정. 다른 secrets 없음.
#   - 워크플로 기본 권한은 없음. check는 contents: read, image는 packages: write, contents: write는 promote 잡에만.
#   - GITHUB_TOKEN의 push는 다른 워크플로를 깨우지 않는다(production push로 Actions가 다시 돌지 않는다).
#     저장소 웹훅(Jenkins githubPush)은 깨운다.
name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/pr-check.yml
    permissions:
      contents: read

  image:
    needs: check
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  promote:
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # 승격이 겹치지 않게 저장소 전체에서 하나씩. 끊지 않고 줄 세운다 —
    # 기다리는 실행이 둘이면 GitHub이 앞 것을 취소한다(뒤 것이 더 새 sha라 괜찮다).
    concurrency:
      group: production-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # production이 이 sha의 조상인지 보려면 이력이 있어야 한다
      - name: production fast-forward
        env:
          SHA: ${{ github.sha }}
        run: bash scripts/ci/promote.sh ff "$SHA"

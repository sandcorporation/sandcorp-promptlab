[package]
name = "promptlab-dashboard"
description = "Dioxus 웹 대시보드(고객사 담당자·감독관·운영자). wasm32 대상으로 띄운다"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
promptlab-shared.workspace = true
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true

# 렌더러(web)는 wasm32에서만 켠다. 네이티브 `cargo build --workspace`에서는 컴포넌트만 컴파일된다.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
# 같은 출처 `/api` 호출(세션 쿠키)과 주소창 읽기.
gloo-net = { version = "0.6.0", default-features = false, features = ["http", "json"] }
web-sys = { version = "0.3.107", features = ["Window", "Location", "History", "Navigator", "Clipboard", "Document", "Element", "HtmlElement", "HtmlDialogElement", "EventTarget"] }
wasm-bindgen = "0.2"
# 미리 돌리기 결과 폴링(#16) 간격.
gloo-timers = { version = "0.3.0", features = ["futures"] }

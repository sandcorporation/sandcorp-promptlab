[package]
name = "promptlab-judge"
description = "판정기: 언어 → 고정 러너 이미지, 상한 플래그 상수, docker CLI 실행·결과 해석(lib) + compose 내부 HTTP `POST /run`(bin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 서버·store에 기대지 않는다 — 응시 앱이 같은 lib(docker CLI 실행)을 HTTP 없이 쓴다(`default-features = false`).

[features]
default = ["http"]
http = ["dep:axum", "dep:tracing", "dep:tracing-subscriber", "tokio/net", "tokio/signal", "tokio/rt-multi-thread"]

[dependencies]
promptlab-shared.workspace = true
promptlab-runner = { path = "../runner" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
uuid.workspace = true
axum = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[[bin]]
name = "promptlab-judge"
required-features = ["http"]
